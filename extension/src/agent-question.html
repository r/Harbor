<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent is asking - Harbor</title>
  <link rel="stylesheet" href="design-tokens.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg-base);
      color: var(--color-text-primary);
      padding: var(--space-4);
      min-height: 100vh;
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--color-border-subtle);
    }

    h1 {
      font-size: var(--text-lg);
      font-weight: var(--weight-semibold);
      color: var(--color-text-primary);
      margin-bottom: var(--space-1);
    }

    .subtext {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      word-break: break-all;
    }

    .tool-card {
      background: var(--color-surface-secondary);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-sm);
      padding: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .tool-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }

    .tool-title {
      font-weight: var(--weight-medium);
      font-size: var(--text-sm);
      color: var(--color-text-primary);
      word-break: break-word;
    }

    .tool-kind-badge {
      font-size: 9px;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-weight: var(--weight-semibold);
      background: var(--color-accent-primary-subtle);
      color: var(--color-accent-primary);
    }

    .section-title {
      font-size: var(--text-2xs);
      font-weight: var(--weight-semibold);
      margin-bottom: var(--space-1);
      color: var(--color-text-muted);
    }

    .raw-input-section {
      margin-top: var(--space-3);
    }

    .raw-input {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      background: var(--color-code-bg);
      color: var(--color-code-text);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-sm);
      padding: var(--space-2);
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .btn-link {
      margin-top: var(--space-2);
      background: none;
      border: none;
      color: var(--color-accent-primary);
      font-size: var(--text-xs);
      font-family: var(--font-sans);
      cursor: pointer;
      padding: 0;
    }

    .btn-link:hover {
      text-decoration: underline;
    }

    .locations-section {
      margin-top: var(--space-3);
    }

    .locations-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .location-item {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
      word-break: break-all;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .btn {
      width: 100%;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      cursor: pointer;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
      font-family: var(--font-sans);
    }

    .btn-allow {
      background: var(--color-success);
      color: var(--color-text-inverse);
    }

    .btn-allow:hover {
      opacity: 0.9;
    }

    .btn-reject {
      background: var(--color-surface-secondary);
      color: var(--color-text-primary);
      border-color: var(--color-border-default);
    }

    .btn-reject:hover {
      background: var(--color-bg-subtle);
      border-color: var(--color-border-strong);
    }

    .error-message {
      color: var(--color-text-muted);
      font-size: var(--text-sm);
      padding: var(--space-4) 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container" id="content">
    <div class="header">
      <h1 id="heading">Loading…</h1>
      <div class="subtext" id="subtext"></div>
    </div>

    <div class="tool-card">
      <div class="tool-header">
        <span class="tool-title" id="tool-title"></span>
        <span class="tool-kind-badge" id="tool-kind" style="display: none;"></span>
      </div>

      <div class="raw-input-section" id="raw-input-section" style="display: none;">
        <div class="section-title">Raw input</div>
        <pre class="raw-input" id="raw-input"></pre>
        <button class="btn-link" id="btn-show-all" style="display: none;">Show all</button>
      </div>

      <div class="locations-section" id="locations-section" style="display: none;">
        <div class="section-title">Locations</div>
        <div class="locations-list" id="locations-list"></div>
      </div>
    </div>

    <div class="actions" id="options"></div>
  </div>

  <script src="agent-question.js"></script>
</body>
</html>
