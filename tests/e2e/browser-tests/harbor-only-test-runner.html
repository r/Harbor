<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Harbor-only E2E Test Runner</title>
</head>
<body>
  <h1>Harbor-only E2E Test Runner</h1>
  <div id="progress">Initializing...</div>
  <script type="module">
    const results = [];

    function log(msg) {
      console.log(`[E2E:harbor-only] ${msg}`);
    }

    async function test(suite, name, fn) {
      const entry = { suite, name, status: 'running', error: null };
      results.push(entry);
      try {
        await fn();
        entry.status = 'pass';
        log(`PASS: ${suite} > ${name}`);
      } catch (err) {
        entry.status = 'fail';
        entry.error = err && err.message ? err.message : String(err);
        log(`FAIL: ${suite} > ${name} - ${entry.error}`);
      }
    }

    function assert(condition, message) {
      if (!condition) throw new Error(message || 'Assertion failed');
    }

    async function waitForAPIs(timeout = 15000) {
      const start = Date.now();
      while (Date.now() - start < timeout) {
        if (typeof window.ai !== 'undefined' && typeof window.agent !== 'undefined') return true;
        await new Promise((r) => setTimeout(r, 100));
      }
      return false;
    }

    async function run() {
      document.getElementById('progress').textContent = 'Waiting for the page API...';
      const hasAPIs = await waitForAPIs();

      if (!hasAPIs) {
        await test('Harbor-only', 'window.ai and window.agent are injected', async () => {
          throw new Error('window.ai / window.agent not found with only extension/dist-firefox loaded');
        });
      } else {
        await test('Harbor-only', 'window.ai is defined', async () => {
          assert(typeof window.ai !== 'undefined', 'window.ai should be defined');
        });

        await test('Harbor-only', 'window.agent is defined', async () => {
          assert(typeof window.agent !== 'undefined', 'window.agent should be defined');
        });

        await test('Harbor-only', 'navigator.modelContext is defined', async () => {
          assert(typeof navigator.modelContext === 'object', 'navigator.modelContext should be defined');
          assert(typeof navigator.modelContext.addTool === 'function', 'addTool should be a function');
        });

        await test('Harbor-only', "agent.capabilities() reports apiVersion '1.4.0'", async () => {
          const caps = window.agent.capabilities();
          assert(caps.apiVersion === '1.4.0', `Expected apiVersion 1.4.0, got ${caps.apiVersion}`);
        });

        await test('Harbor-only', "window.ai.canCreateTextSession() returns 'readily'", async () => {
          const availability = await window.ai.canCreateTextSession();
          assert(availability === 'readily', `Expected 'readily', got '${availability}'`);
        });
      }

      // Harbor no longer injects a discovery global onto any page — only
      // the page API (window.ai / window.agent) above. A still-installed,
      // separate extension (or any page script) must not see window.__harbor.
      await test('Harbor-only', 'window.__harbor is not defined', async () => {
        assert(typeof window.__harbor === 'undefined', `Expected window.__harbor to be undefined, got ${JSON.stringify(window.__harbor)}`);
      });

      const passed = results.filter((r) => r.status === 'pass').length;
      const failed = results.filter((r) => r.status === 'fail').length;
      const total = results.length;
      const failures = results.filter((r) => r.status === 'fail')
        .map((r) => ({ suite: r.suite, name: r.name, error: r.error }));

      document.getElementById('progress').textContent = `${passed}/${total} passed`;
      log(`RESULTS: ${passed} passed, ${failed} failed, ${total} total`);
      log(failed === 0 ? 'STATUS: PASS' : 'STATUS: FAIL');

      try {
        await fetch('/__test_results__', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passed, failed, total, failures }),
        });
        log('Results posted to test server');
      } catch (err) {
        log(`Failed to post results: ${err.message}`);
      }
    }

    run();
  </script>
</body>
</html>
