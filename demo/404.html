<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Page not found — Harbor demos</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    body { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; padding: 0 28px; }
    .error-header { width: min(1180px, 100%); margin: 0 auto; padding: 24px 0; border-bottom: 1px solid var(--demo-border-default); }
    .error-brand { display: inline-flex; align-items: baseline; gap: 10px; font-size: 1.6rem; font-weight: 750; letter-spacing: -.03em; text-decoration: none; color: var(--demo-text-primary); }
    .error-mark { width: 17px; height: 17px; background: repeating-linear-gradient(0deg, currentColor 0 3px, transparent 3px 5px); border: 1.5px solid currentColor; transform: skewY(-14deg); }
    .error-main { width: min(720px, 100%); margin: auto; padding: 64px 0 96px; }
    .error-code { font: .8rem var(--demo-font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--demo-accent-primary); margin-bottom: 24px; }
    h1 { max-width: 12ch; font-size: clamp(3.4rem, 8vw, 6rem); line-height: .98; font-weight: 750; letter-spacing: -.06em; margin-bottom: 28px; }
    .error-message { max-width: 44ch; font-size: 1.15rem; line-height: 1.6; color: var(--demo-text-secondary); margin-bottom: 32px; }
    .error-back { display: inline-flex; align-items: center; gap: 24px; padding: 13px 20px; font-weight: 650; text-decoration: none; background: var(--demo-accent-primary); color: var(--demo-bg-base); border: 1px solid var(--demo-accent-primary); }
    .error-back:hover { background: var(--demo-bg-surface); color: var(--demo-text-primary); }
    a:focus-visible { outline: 3px solid var(--demo-accent-primary); outline-offset: 5px; }
    @media (max-width: 480px) { body { padding: 0 20px; } }
  </style>
</head>
<body>
  <header class="error-header"><a class="error-brand" href="./"><span class="error-mark" aria-hidden="true"></span>Harbor</a></header>
  <main class="error-main">
    <p class="error-code">404 · Harbor demos</p>
    <h1>Page not found.</h1>
    <p class="error-message">The page you’re looking for does not exist or has moved. Find a working example in the demo directory.</p>
    <a href="./" class="error-back"><span aria-hidden="true">←</span> Back to demos</a>
  </main>
</body>
</html>
